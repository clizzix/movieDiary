<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Journal - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      #search-dialog::backdrop {
        background: rgba(2, 6, 23, 0.7);
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-900 text-slate-100 antialiased">
    <header
      class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md"
    >
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <div class="flex items-center gap-3">
          <span
            class="grid h-9 w-9 place-items-center rounded-xl border border-sky-500/40 bg-slate-900 shadow-lg shadow-sky-500/20"
            >🎬</span
          >
          <div class="leading-tight">
            <div class="text-lg font-semibold tracking-tight">Movie Journal</div>
            <div class="text-xs text-slate-400">TMDB Movie Diary</div>
          </div>
        </div>

        <nav class="flex items-center gap-2 text-sm">
          <a
            href="index.html"
            class="rounded-xl border border-sky-500/40 bg-slate-900 px-3 py-1.5 font-medium text-slate-50 shadow-sm shadow-sky-500/20"
            >Homepage</a
          >
          <a
            href="journal.html"
            class="rounded-xl border border-transparent px-3 py-1.5 text-slate-300 hover:border-slate-700 hover:bg-slate-900 hover:text-slate-50"
            >Journal</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 pb-12 pt-10">
      <header class="mb-8">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
          Popular Movies
          <span class="ml-2 align-middle text-sky-400">●</span>
        </h1>
        <p class="mt-2 max-w-2xl text-sm leading-relaxed text-slate-300">
          Browse trending movies. Use the search bar to look up something
          specific and add your favourites to your personal journal.
        </p>
        <div
          class="mt-5 h-px w-full bg-gradient-to-r from-sky-500/40 via-slate-800 to-transparent"
        ></div>
      </header>

      <!-- Search form -->
      <form
        id="search-form"
        class="mb-6 flex flex-wrap items-center gap-2 rounded-xl border border-slate-800 bg-slate-950/40 p-3"
      >
        <input
          id="search-input"
          type="text"
          placeholder="Search for a movie…"
          autocomplete="off"
          class="flex-grow min-w-[220px] rounded-lg border border-slate-700 bg-slate-800/70 px-4 py-2 text-sm text-slate-100 placeholder:text-slate-400 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/40"
        />

        <button
          type="submit"
          class="rounded-xl bg-sky-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-sky-700 active:scale-[0.99]"
        >
          Search
        </button>
      </form>

      <!-- Movies grid -->
      <section
        id="movies-container"
        class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5"
      >
        <!-- Movie cards injected by main.js -->
      </section>
    </main>

    <!-- Search feedback dialog -->
    <dialog
      id="search-dialog"
      class="w-[95%] max-w-md rounded-2xl border border-slate-700 bg-slate-800 p-4 shadow-xl"
    >
      <div class="mb-2 flex items-center justify-between">
        <h2 class="text-sm font-semibold tracking-tight">Search</h2>
        <button
          type="button"
          id="dialog-close"
          aria-label="Close"
          class="text-lg leading-none text-slate-300 hover:text-white"
        >
          ×
        </button>
      </div>
      <div id="dialog-content" class="text-sm text-slate-100"></div>
    </dialog>

    <script src="main.js"></script>
  </body>
</html>
