<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Journal - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur-md">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3"
      >
        <div class="flex items-center gap-2">
          <span class="text-xl"></span>
          <span class="text-lg font-semibold tracking-tight"
            >Movie Journal</span
          >
        </div>
        <nav class="flex items-center gap-4 text-sm">
          <a
            href="index.html"
            class="border-b-2 border-sky-500 pb-0.5 text-slate-50"
            >Homepage</a
          >
          <a
            href="journal.html"
            class="border-b-2 border-transparent pb-0.5 text-slate-300"
            >Journal</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 pb-12 pt-6">
      <header class="mb-6">
        <h1 class="text-3xl font-bold tracking-tight">Popular Movies</h1>
        <p class="mt-2 text-slate-300">
          Browse trending movies. Use the search bar to look up something
          specific and add your favourites to your personal journal.
        </p>
      </header>

      <!-- Search form -->
      <form id="search-form" class="mb-6 flex gap-2">
        <input
          id="search-input"
          type="text"
          placeholder="Search for a movie…"
          autocomplete="off"
          class="flex-grow rounded-lg border bg-slate-800 px-4 py-2 text-sm text-slate text-slate-100"
        />
        <button type="submit" class="rounded-2xl bg-sky-600 px-4">
          Search
        </button>
      </form>

      <!-- Movies grid -->
      <section
        id="movies-container"
        class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5"
      >
        <!-- Movie cards injected by main.js -->
      </section>
    </main>

    <!-- Search feedback dialog -->
    <dialog
      id="search-dialog"
      class="w-[95%] max-w-md rounded-2xl bg-slate-800 p-4"
    >
      <div class="mb-2 flex items-center justify-between">
        <h2 class="text-sm font-semibold tracking-tight">Search</h2>
        <button
          type="button"
          id="dialog-close"
          aria-label="Close"
          class="text-lg leading-none text-slate-300"
        >
          ×
        </button>
      </div>
      <div id="dialog-content" class="text-sm text-slate-100"></div>
    </dialog>

    <script src="main.js"></script>
  </body>
</html>
