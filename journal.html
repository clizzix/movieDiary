<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MovieDiary</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete"
        />
    </head>
    <body
        class="bg-[url(https://images.pexels.com/photos/713149/pexels-photo-713149.jpeg)] bg-top-right text-slate-100 antialiased"
    >
        <header
            class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md"
        >
            <div
                class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3"
            >
                <div class="flex items-center gap-3">
                    <span
                        class="grid h-9 w-9 place-items-center rounded-xl border border-sky-500/40 bg-slate-900 shadow-lg shadow-sky-500/20"
                        >🎬</span
                    >
                    <div class="leading-tight">
                        <div class="text-lg font-semibold tracking-tight">
                            Movie Journal
                        </div>
                        <div class="text-xs text-slate-400">
                            TMDB Movie Diary
                        </div>
                    </div>
                </div>
                <nav class="flex items-center gap-2 text-sm">
                    <a
                        href="index.html"
                        class="rounded-xl border border-transparent px-3 py-1.5 text-slate-300 hover:border-slate-700 hover:bg-slate-900 hover:text-slate-50"
                        >Homepage</a
                    >
                    <a
                        href="journal.html"
                        class="rounded-xl border border-sky-500/40 bg-slate-900 px-3 py-1.5 font-medium text-slate-50 shadow-sm shadow-sky-500/20"
                        >Journal</a
                    >
                </nav>
            </div>
        </header>
        <main class="mx-auto max-w-6xl px-4 pb-12 pt-10">
            <section id="hero">
                <div id="hero-div" class="p-8">
                    <h2 class="text-xl text-white text-center text-shadow-xl">
                        Your
                        <strong class="text-sky-500 text-2xl"
                            >favorite Movies</strong
                        >
                        are here...
                    </h2>
                </div>
            </section>
            <section id="movie-cards"></section>
        </main>
    </body>
    <script src="journal.js"></script>
</html>
